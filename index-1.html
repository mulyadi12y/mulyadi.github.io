<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kasir - Warungku</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #111827;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: #29a9d8;
            color: white;
            padding: 20px 5%;
        }

        .header-content {
            max-width: 1200px;
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        header h1 {
            font-size: clamp(25px, 4vw, 40px);
        }

        .back {
            color: white;
            text-decoration: none;

            background: rgba(0, 0, 0, 0.15);

            padding: 10px 15px;
            border-radius: 8px;
        }

        .back:hover {
            background: rgba(0, 0, 0, 0.25);
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            max-width: 1200px;

            margin: 30px auto;

            padding: 0 20px;

            display: grid;

            grid-template-columns:
                1.5fr 1fr;

            gap: 25px;
        }

        /* =========================
           CARD
        ========================= */

        .card {
            background: white;

            border-radius: 15px;

            padding: 20px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-bottom: 15px;
        }

        /* =========================
           SEARCH
        ========================= */

        .search {
            width: 100%;

            padding: 14px 16px;

            border: 2px solid #e5e7eb;

            border-radius: 10px;

            font-size: 16px;

            outline: none;

            margin-bottom: 20px;
        }

        .search:focus {
            border-color: #29a9d8;
        }

        /* =========================
           PRODUCT LIST
        ========================= */

        .products {
            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(160px, 1fr));

            gap: 12px;
        }

        .product {
            background: #f8fafc;

            border: 2px solid #e5e7eb;

            border-radius: 10px;

            padding: 15px;

            cursor: pointer;

            transition: 0.2s;
        }

        .product:hover {
            border-color: #29a9d8;

            background: #effaff;

            transform: translateY(-2px);
        }

        .product-name {
            font-weight: bold;

            margin-bottom: 8px;
        }

        .product-price {
            color: #0ea5e9;

            font-weight: bold;
        }

        .not-found {
            text-align: center;

            color: #64748b;

            padding: 20px;

            grid-column: 1 / -1;
        }

        /* =========================
           CART
        ========================= */

        .cart {
            min-height: 100px;
        }

        .cart-item {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            padding: 12px 0;

            border-bottom: 1px solid #e5e7eb;
        }

        .cart-info {
            flex: 1;
        }

        .cart-name {
            font-weight: bold;

            margin-bottom: 5px;
        }

        .cart-subtotal {
            color: #64748b;

            font-size: 14px;
        }

        /* =========================
           QUANTITY
        ========================= */

        .quantity {
            display: flex;

            align-items: center;

            gap: 5px;
        }

        .quantity button {
            width: 30px;
            height: 30px;

            border: none;

            border-radius: 6px;

            background: #e2e8f0;

            cursor: pointer;

            font-size: 18px;
        }

        .quantity button:hover {
            background: #cbd5e1;
        }

        .quantity span {
            width: 25px;

            text-align: center;

            font-weight: bold;
        }

        /* =========================
           TOTAL
        ========================= */

        .summary {
            margin-top: 20px;

            padding-top: 15px;

            border-top: 2px solid #e5e7eb;
        }

        .total {
            display: flex;

            justify-content: space-between;

            font-size: 24px;

            font-weight: bold;

            margin-bottom: 20px;
        }

        .total-price {
            color: #0284c7;
        }

        /* =========================
           PAYMENT
        ========================= */

        label {
            display: block;

            font-weight: bold;

            margin-bottom: 8px;
        }

        .payment-input {
            width: 100%;

            padding: 13px;

            border: 2px solid #e5e7eb;

            border-radius: 8px;

            font-size: 17px;

            outline: none;
        }

        .payment-input:focus {
            border-color: #29a9d8;
        }

        .change {
            display: flex;

            justify-content: space-between;

            margin-top: 15px;

            padding: 15px;

            border-radius: 8px;

            background: #ecfdf5;

            color: #047857;

            font-weight: bold;
        }

        /* =========================
           BUTTON
        ========================= */

        .buttons {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;

            margin-top: 15px;
        }

        .btn {
            border: none;

            padding: 14px;

            border-radius: 8px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .btn-clear {
            background: #fee2e2;

            color: #dc2626;
        }

        .btn-print {
            background: #22c55e;

            color: white;
        }

        .btn:hover {
            opacity: 0.85;
        }

        /* =========================
           EMPTY CART
        ========================= */

        .empty {
            text-align: center;

            padding: 30px 10px;

            color: #64748b;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 800px) {

            .container {
                grid-template-columns: 1fr;
            }

            .header-content {
                align-items: flex-start;

                flex-direction: column;
            }

            .back {
                width: 100%;

                text-align: center;
            }
        }

        @media (max-width: 450px) {

            .container {
                padding: 0 12px;

                margin-top: 15px;
            }

            .card {
                padding: 15px;
            }

            .products {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .product {
                padding: 12px;
            }

            .cart-item {
                align-items: flex-start;

                flex-wrap: wrap;
            }

            .quantity {
                width: 100%;

                justify-content: flex-end;
            }

            .buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <div class="header-content">

            <h1>🛒 Warungku Kasir</h1>

            <a href="../" class="back">
                ← Kembali
            </a>

        </div>

    </header>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="container">


        <!-- =====================
             DAFTAR BARANG
        ====================== -->

        <section class="card">

            <h2>Daftar Barang</h2>

            <input
                type="text"
                id="search"
                class="search"
                placeholder="🔍 Cari nama barang..."
                oninput="cariBarang()"
            >

            <div
                id="products"
                class="products"
            ></div>

        </section>


        <!-- =====================
             KERANJANG
        ====================== -->

        <section class="card">

            <h2>Keranjang</h2>

            <div
                id="cart"
                class="cart"
            ></div>

            <div class="summary">

                <div class="total">

                    <span>Total</span>

                    <span
                        id="total"
                        class="total-price"
                    >
                        Rp0
                    </span>

                </div>


                <label for="payment">
                    Uang Dibayar
                </label>

                <input
                    type="number"
                    id="payment"
                    class="payment-input"
                    placeholder="Masukkan uang..."
                    oninput="hitungKembalian()"
                >


                <div class="change">

                    <span>Kembalian</span>

                    <span id="change">
                        Rp0
                    </span>

                </div>


                <div class="buttons">

                    <button
                        class="btn btn-clear"
                        onclick="kosongkanKeranjang()"
                    >
                        🗑️ Kosongkan
                    </button>

                    <button
                        class="btn btn-print"
                        onclick="cetakStruk()"
                    >
                        🧾 Cetak Struk
                    </button>

                </div>

            </div>

        </section>

    </main>


    <script>

        /* =====================================
           DATA BARANG

           EDIT HARGA DI BAGIAN INI
        ====================================== */

        const daftarBarang = [

            {
                id: 1,
                nama: "Minyak Ganteng",
                harga: 10000
            },

            {
                id: 2,
                nama: "Telur",
                harga: 3000
            },

            {
                id: 3,
                nama: "Gula",
                harga: 5000
            },

            {
                id: 4,
                nama: "Beras",
                harga: 15000
            },

            {
                id: 5,
                nama: "Kopi",
                harga: 2500
            },

            {
                id: 6,
                nama: "Teh",
                harga: 3000
            },

            {
                id: 7,
                nama: "Mie Instan",
                harga: 3500
            },

            {
                id: 8,
                nama: "Susu",
                harga: 7000
            },

            {
                id: 9,
                nama: "Sabun Mandi",
                harga: 4000
            },

            {
                id: 10,
                nama: "Shampoo",
                harga: 8500
            }

        ];


        /* =====================================
           KERANJANG
        ====================================== */

        let keranjang = [];


        /* =====================================
           FORMAT RUPIAH
        ====================================== */

        function rupiah(angka) {

            return new Intl.NumberFormat(
                "id-ID",
                {
                    style: "currency",
                    currency: "IDR",
                    minimumFractionDigits: 0
                }
            ).format(angka);

        }


        /* =====================================
           TAMPILKAN BARANG
        ====================================== */

        function tampilkanBarang(data = daftarBarang) {

            const products =
                document.getElementById("products");

            products.innerHTML = "";


            if (data.length === 0) {

                products.innerHTML = `
                    <div class="not-found">
                        Barang tidak ditemukan
                    </div>
                `;

                return;
            }


            data.forEach(barang => {

                const div =
                    document.createElement("div");

                div.className = "product";

                div.innerHTML = `

                    <div class="product-name">
                        ${barang.nama}
                    </div>

                    <div class="product-price">
                        ${rupiah(barang.harga)}
                    </div>

                `;


                div.onclick = function() {

                    tambahKeKeranjang(barang.id);

                };


                products.appendChild(div);

            });

        }


        /* =====================================
           SEARCH
        ====================================== */

        function cariBarang() {

            const keyword =
                document
                    .getElementById("search")
                    .value
                    .toLowerCase();


            const hasil =
                daftarBarang.filter(barang =>

                    barang.nama
                        .toLowerCase()
                        .includes(keyword)

                );


            tampilkanBarang(hasil);

        }


        /* =====================================
           TAMBAH BARANG
        ====================================== */

        function tambahKeKeranjang(id) {

            const barang =
                daftarBarang.find(
                    item => item.id === id
                );


            const item =
                keranjang.find(
                    item => item.id === id
                );


            if (item) {

                item.jumlah++;

            } else {

                keranjang.push({

                    id: barang.id,

                    nama: barang.nama,

                    harga: barang.harga,

                    jumlah: 1

                });

            }


            tampilkanKeranjang();

        }


        /* =====================================
           TAMPILKAN KERANJANG
        ====================================== */

        function tampilkanKeranjang() {

            const cart =
                document.getElementById("cart");


            cart.innerHTML = "";


            if (keranjang.length === 0) {

                cart.innerHTML = `
                    <div class="empty">
                        Keranjang masih kosong.
                        <br>
                        Pilih barang di sebelah kiri.
                    </div>
                `;

                updateTotal();

                return;
            }


            keranjang.forEach(item => {

                const subtotal =
                    item.harga * item.jumlah;


                const div =
                    document.createElement("div");

                div.className = "cart-item";


                div.innerHTML = `

                    <div class="cart-info">

                        <div class="cart-name">
                            ${item.nama}
                        </div>

                        <div class="cart-subtotal">
                            ${item.jumlah} ×
                            ${rupiah(item.harga)}
                            =
                            ${rupiah(subtotal)}
                        </div>

                    </div>


                    <div class="quantity">

                        <button
                            onclick="kurangi(${item.id})"
                        >
                            −
                        </button>

                        <span>
                            ${item.jumlah}
                        </span>

                        <button
                            onclick="tambahKeKeranjang(${item.id})"
                        >
                            +
                        </button>

                    </div>

                `;


                cart.appendChild(div);

            });


            updateTotal();

        }


        /* =====================================
           KURANGI JUMLAH
        ====================================== */

        function kurangi(id) {

            const item =
                keranjang.find(
                    item => item.id === id
                );


            if (!item) return;


            item.jumlah--;


            if (item.jumlah <= 0) {

                keranjang =
                    keranjang.filter(
                        item => item.id !== id
                    );

            }


            tampilkanKeranjang();

        }


        /* =====================================
           HITUNG TOTAL
        ====================================== */

        function hitungTotal() {

            return keranjang.reduce(

                (total, item) => {

                    return total +
                        (item.harga * item.jumlah);

                },

                0

            );

        }


        function updateTotal() {

            const total =
                hitungTotal();


            document.getElementById("total")
                .innerText = rupiah(total);


            hitungKembalian();

        }


        /* =====================================
           HITUNG KEMBALIAN
        ====================================== */

        function hitungKembalian() {

    const total = hitungTotal();

    const payment = Number(
        document.getElementById("payment").value
    );

    const element =
        document.getElementById("change");


    // Kalau belum memasukkan uang
    if (!payment || payment <= 0) {

        element.innerText = "Rp0";

        return;
    }


    // Kalau uang kurang
    if (payment < total) {

        const kurang = total - payment;

        element.innerText =
            "Uang kurang " + rupiah(kurang);

        element.style.color = "#dc2626";

        return;
    }


    // Kalau uang cukup
    const kembalian = payment - total;

    element.innerText =
        rupiah(kembalian);

    element.style.color = "#047857";
}



        /* =====================================
           KOSONGKAN KERANJANG
        ====================================== */

        function kosongkanKeranjang() {

            if (keranjang.length === 0) {
                return;
            }


            const yakin =
                confirm(
                    "Kosongkan semua barang?"
                );


            if (!yakin) {
                return;
            }


            keranjang = [];


            document.getElementById("payment")
                .value = "";


            tampilkanKeranjang();

        }


        /* =====================================
           CETAK STRUK
        ====================================== */

        function cetakStruk() {

            if (keranjang.length === 0) {

                alert(
                    "Keranjang masih kosong!"
                );

                return;
            }


            const total =
                hitungTotal();


            const payment =
                Number(
                    document.getElementById("payment").value
                );


            if (payment < total) {

                alert(
                    "Uang pembayaran belum cukup!"
                );

                return;
            }


            const kembalian =
                payment - total;


            let struk = "";


            struk +=
                "==============================\n";

            struk +=
                "          WARUNGKU\n";

            struk +=
                "==============================\n\n";


            keranjang.forEach(item => {

                const subtotal =
                    item.harga * item.jumlah;


                struk +=
                    `${item.nama}\n`;

                struk +=
                    `${item.jumlah} x ${rupiah(item.harga)} = ${rupiah(subtotal)}\n\n`;

            });


            struk +=
                "------------------------------\n";

            struk +=
                `TOTAL      : ${rupiah(total)}\n`;

            struk +=
                `DIBAYAR    : ${rupiah(payment)}\n`;

            struk +=
                `KEMBALIAN  : ${rupiah(kembalian)}\n`;

            struk +=
                "==============================\n";

            struk +=
                "       TERIMA KASIH 🙏\n";

            struk +=
                "==============================";


            const jendela =
                window.open(
                    "",
                    "_blank",
                    "width=400,height=600"
                );


            jendela.document.write(`

                <html>

                <head>

                    <title>Struk Warungku</title>

                    <style>

                        body {
                            font-family:
                                monospace;

                            padding: 20px;

                            white-space:
                                pre-wrap;
                        }

                    </style>

                </head>

                <body>

                    ${struk}

                    <script>

                        window.onload =
                            function() {

                                window.print();

                            };

                    <\/script>

                </body>

                </html>

            `);


            jendela.document.close();

        }


        /* =====================================
           JALANKAN SAAT WEBSITE DIBUKA
        ====================================== */

        tampilkanBarang();

        tampilkanKeranjang();

    </script>

</body>
</html>
